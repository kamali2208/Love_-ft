<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Advance Happy Birthday Partner ❤️</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 25%,
      #35153f 0%,
      #0b0710 48%,
      #020204 100%
    );
  color:white;
  font-family:Georgia,serif;
}

/* =========================
   MAIN PAGE
========================= */

#page{
  width:100%;
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:12px;
}

#game{
  width:min(94vw,500px);
  text-align:center;
}

/* =========================
   TITLE
========================= */

.heading{
  color:#f7da91;

  font-size:
    clamp(22px,6vw,33px);

  letter-spacing:2px;

  margin-bottom:6px;

  text-shadow:
    0 0 15px rgba(255,215,120,.3);
}

.info{
  color:#bdb1c5;

  font-size:10px;

  letter-spacing:2px;

  margin-bottom:15px;
}

/* =========================
   PREMIUM FRAME
========================= */

.frame{
  position:relative;

  width:min(92vw,430px);
  aspect-ratio:1/1;

  margin:auto;

  padding:5px;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      #fff0a3 0%,
      #946024 20%,
      #e7c36b 48%,
      #76501f 75%,
      #fff0a3 100%
    );

  box-shadow:
    0 0 0 1px rgba(255,255,255,.18),
    0 20px 70px rgba(0,0,0,.9),
    0 0 45px rgba(230,190,90,.25);
}

/* =========================
   PUZZLE BOARD
========================= */

#board{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  border-radius:11px;

  background:#000;

  touch-action:none;
}

/* =========================
   PIECE
========================= */

.piece{
  position:absolute;

  width:33.333333%;
  height:33.333333%;

  cursor:grab;

  user-select:none;
  touch-action:none;

  z-index:10;

  transition:
    left .20s cubic-bezier(.2,.8,.2,1),
    top .20s cubic-bezier(.2,.8,.2,1),
    transform .13s ease;
}

/*
   DRAGGING PIECE
   ALWAYS ON TOP
*/

.piece.dragging{
  cursor:grabbing;

  z-index:9999 !important;

  transform:scale(1.045);

  filter:
    drop-shadow(
      0 12px 18px rgba(0,0,0,.85)
    );
}

/*
   PLACED PIECE
   GOES TO BOTTOM
*/

.piece.locked{
  cursor:default;

  z-index:1 !important;

  transform:none;

  filter:none;
}

/*
   SVG EXTENSION
   Allows tabs to overlap
   neighbouring pieces.
*/

.piece svg{
  position:absolute;

  left:-25%;
  top:-25%;

  width:150%;
  height:150%;

  display:block;

  overflow:visible;

  pointer-events:none;
}

/* =========================
   PUZZLE EDGE
========================= */

.seam{
  fill:none;

  stroke:
    rgba(255,255,255,.28);

  stroke-width:.8;

  vector-effect:
    non-scaling-stroke;
}

/* =========================
   PROGRESS
========================= */

.progress{
  width:82%;

  height:5px;

  margin:15px auto 0;

  border-radius:20px;

  overflow:hidden;

  background:#29232d;
}

#bar{
  width:0%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      #9c6827,
      #ffe8a0,
      #b67d2e
    );

  box-shadow:
    0 0 14px #e6c66d;

  transition:
    width .35s ease;
}

#status{
  min-height:20px;

  margin-top:8px;

  color:#d0c4d5;

  font-size:12px;
}

/* =========================
   FINAL SCREEN
========================= */

#final{
  position:fixed;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:20px;

  z-index:500;

  background:
    radial-gradient(
      circle at center,
      #421a51,
      #0b050e 60%,
      #020204 100%
    );
}

.finalBox{
  width:min(92vw,500px);

  animation:
    finalIn 1.25s
    cubic-bezier(.2,.9,.2,1);
}

@keyframes finalIn{

  from{
    opacity:0;

    transform:
      scale(.65)
      translateY(30px);
  }

  to{
    opacity:1;

    transform:
      scale(1)
      translateY(0);
  }

}

.finalPhoto{
  width:min(64vw,270px);
  height:min(64vw,270px);

  object-fit:cover;

  border-radius:50%;

  padding:5px;

  background:
    linear-gradient(
      135deg,
      #fff2aa,
      #996723,
      #fff2aa
    );

  box-shadow:
    0 0 30px rgba(255,215,120,.65),
    0 0 90px rgba(255,175,60,.28);
}

.complete{
  margin-top:20px;

  color:#d0c2d5;

  font-size:10px;

  letter-spacing:4px;
}

.wish{
  margin-top:12px;

  color:#ffe5a0;

  font-size:
    clamp(29px,8vw,55px);

  line-height:1.04;

  text-shadow:
    0 0 15px rgba(255,220,130,.7),
    0 0 55px rgba(255,180,60,.3);
}

.partner{
  margin-top:12px;

  color:#fff;

  font-size:
    clamp(20px,5vw,29px);

  letter-spacing:5px;
}

.message{
  margin:18px auto 0;

  max-width:400px;

  color:#d6ccd9;

  font-size:14px;

  line-height:1.8;
}

/* =========================
   CONFETTI
========================= */

.confetti{
  position:fixed;

  top:-20px;

  width:7px;
  height:12px;

  z-index:10000;

  animation:
    fall linear forwards;
}

@keyframes fall{

  to{
    transform:
      translateY(110vh)
      rotate(720deg);

    opacity:0;
  }

}

/* =========================
   SMALL SCREEN
========================= */

@media(max-height:650px){

  #page{
    padding:7px;
  }

  .info{
    margin-bottom:8px;
  }

  .progress{
    margin-top:9px;
  }

}
</style>
</head>


<body>


<!-- =================================
     PUZZLE
================================= -->

<div id="page">

  <div id="game">

    <div class="heading">
      🧩 A Little Memory
    </div>

    <div class="info">
      COMPLETE THE MEMORY TO UNLOCK YOUR WISH
    </div>

    <div class="frame">

      <div id="board"></div>

    </div>

    <div class="progress">
      <div id="bar"></div>
    </div>

    <div id="status">
      Drag every piece into its place ❤️
    </div>

  </div>

</div>


<!-- =================================
     FINAL
================================= -->

<div id="final">

  <div class="finalBox">

    <img
      src="photo01.jpg"
      class="finalPhoto"
      alt="Birthday Memory"
    >

    <div class="complete">
      MEMORY COMPLETE ✨
    </div>

    <div class="wish">
      ADVANCE HAPPY<br>
      BIRTHDAY
    </div>

    <div class="partner">
      PARTNER ❤️
    </div>

    <div class="message">
      Every little piece found its place...
      <br>
      just like every beautiful memory
      finds its place in the heart. ❤️
    </div>

  </div>

</div>


<script>

/* =================================
   SETTINGS
================================= */

const IMAGE = "photo01.jpg";

const ROWS = 3;
const COLS = 3;

const TOTAL = 9;


/* =================================
   ELEMENTS
================================= */

const board =
  document.getElementById("board");

const bar =
  document.getElementById("bar");

const statusText =
  document.getElementById("status");


/* =================================
   VARIABLES
================================= */

let BW = 0;
let BH = 0;

let PW = 0;
let PH = 0;

let pieces = [];

let solved = 0;

let dragging = null;

let offsetX = 0;
let offsetY = 0;


/* =================================
   SHARED EDGES
================================= */

const rightEdges = [];
const bottomEdges = [];


function randomEdge(){

  return Math.random() < .5
    ? 1
    : -1;

}


function createEdgeData(){

  for(let r=0;r<ROWS;r++){

    rightEdges[r] = [];

    for(let c=0;c<COLS-1;c++){

      rightEdges[r][c] =
        randomEdge();

    }

  }


  for(let r=0;r<ROWS-1;r++){

    bottomEdges[r] = [];

    for(let c=0;c<COLS;c++){

      bottomEdges[r][c] =
        randomEdge();

    }

  }

}


/* =================================
   JIGSAW SHAPES
================================= */

function topEdge(shape){

  const b =
    shape === 1
      ? -25
      : 25;

  return `
    L 30 0
    C 30 ${b},
      70 ${b},
      70 0
    L 100 0
  `;
}


function bottomEdge(shape){

  const b =
    shape === 1
      ? 25
      : -25;

  return `
    L 70 100
    C 70 ${100+b},
      30 ${100+b},
      30 100
    L 0 100
  `;
}


function rightEdge(shape){

  const b =
    shape === 1
      ? -25
      : 25;

  return `
    L 100 30
    C ${100+b} 30,
      ${100+b} 70,
      100 70
    L 100 100
  `;
}


function leftEdge(shape){

  const b =
    shape === 1
      ? 25
      : -25;

  return `
    L 0 70
    C ${b} 70,
      ${b} 30,
      0 30
    L 0 0
  `;
}


/* =================================
   PIECE PATH
================================= */

function makePath(r,c){

  let d = "M 0 0";


  /* TOP */

  if(r === 0){

    d += " L 100 0";

  }else{

    d += topEdge(
      -bottomEdges[r-1][c]
    );

  }


  /* RIGHT */

  if(c === COLS-1){

    d += " L 100 100";

  }else{

    d += rightEdge(
      rightEdges[r][c]
    );

  }


  /* BOTTOM */

  if(r === ROWS-1){

    d += " L 0 100";

  }else{

    d += bottomEdge(
      bottomEdges[r][c]
    );

  }


  /* LEFT */

  if(c === 0){

    d += " L 0 0";

  }else{

    d += leftEdge(
      -rightEdges[r][c-1]
    );

  }


  d += " Z";

  return d;

}


/* =================================
   CREATE PIECE
================================= */

function createPiece(r,c){

  const piece =
    document.createElement("div");

  piece.className =
    "piece";

  piece.style.width =
    PW + "px";

  piece.style.height =
    PH + "px";


  const NS =
    "http://www.w3.org/2000/svg";


  const svg =
    document.createElementNS(
      NS,
      "svg"
    );


  svg.setAttribute(
    "viewBox",
    "-25 -25 150 150"
  );


  svg.setAttribute(
    "preserveAspectRatio",
    "none"
  );


  /* =============================
     CLIP PATH
  ============================= */

  const defs =
    document.createElementNS(
      NS,
      "defs"
    );


  const clip =
    document.createElementNS(
      NS,
      "clipPath"
    );


  const clipID =
    "clip_" + r + "_" + c;


  clip.setAttribute(
    "id",
    clipID
  );


  const pathElement =
    document.createElementNS(
      NS,
      "path"
    );


  const path =
    makePath(r,c);


  pathElement.setAttribute(
    "d",
    path
  );


  clip.appendChild(
    pathElement
  );

  defs.appendChild(clip);

  svg.appendChild(defs);


  /* =============================
     PHOTO
  ============================= */

  const image =
    document.createElementNS(
      NS,
      "image"
    );


  image.setAttribute(
    "href",
    IMAGE
  );


  /*
    Complete photo = 300 × 300.
    Each cell shows its correct
    100 × 100 section.
  */

  image.setAttribute(
    "x",
    -(c * 100)
  );

  image.setAttribute(
    "y",
    -(r * 100)
  );

  image.setAttribute(
    "width",
    "300"
  );

  image.setAttribute(
    "height",
    "300"
  );

  image.setAttribute(
    "preserveAspectRatio",
    "none"
  );

  image.setAttribute(
    "clip-path",
    `url(#${clipID})`
  );


  svg.appendChild(image);


  /* =============================
     EDGE
  ============================= */

  const edge =
    document.createElementNS(
      NS,
      "path"
    );


  edge.setAttribute(
    "d",
    path
  );

  edge.setAttribute(
    "class",
    "seam"
  );


  svg.appendChild(edge);


  piece.appendChild(svg);

  board.appendChild(piece);


  /* =============================
     DATA
  ============================= */

  const data = {

    el:piece,

    row:r,
    col:c,

    correctX:
      c * PW,

    correctY:
      r * PH,

    locked:false

  };


  pieces.push(data);


  piece.addEventListener(
    "pointerdown",
    function(e){

      startDrag(e,data);

    }
  );

}


/* =================================
   BUILD PUZZLE
================================= */

function buildPuzzle(){

  board.innerHTML = "";

  pieces = [];

  solved = 0;


  BW =
    board.clientWidth;

  BH =
    board.clientHeight;


  PW =
    BW / COLS;

  PH =
    BH / ROWS;


  createEdgeData();


  for(let r=0;r<ROWS;r++){

    for(let c=0;c<COLS;c++){

      createPiece(r,c);

    }

  }


  shuffle();


  bar.style.width =
    "0%";

}


/* =================================
   SHUFFLE
================================= */

function shuffle(){

  pieces.forEach(function(p){

    let x;
    let y;


    do{

      x =
        Math.random() *
        (BW - PW);

      y =
        Math.random() *
        (BH - PH);

    }while(

      Math.abs(
        x - p.correctX
      ) < PW * .38 &&

      Math.abs(
        y - p.correctY
      ) < PH * .38

    );


    p.el.style.left =
      x + "px";

    p.el.style.top =
      y + "px";


    /*
      Every shuffled piece is
      above already placed pieces.
    */

    p.el.style.zIndex =
      10;

  });

}


/* =================================
   START DRAG
================================= */

function startDrag(e,p){

  if(p.locked)
    return;


  dragging = p;


  /*
    🔥 MOST IMPORTANT

    Selected piece goes to the
    absolute top.
  */

  p.el.style.zIndex =
    "9999";


  const rect =
    p.el.getBoundingClientRect();


  offsetX =
    e.clientX -
    rect.left;


  offsetY =
    e.clientY -
    rect.top;


  p.el.classList.add(
    "dragging"
  );


  p.el.setPointerCapture(
    e.pointerId
  );


  p.el.onpointermove =
    moveDrag;

  p.el.onpointerup =
    endDrag;

}


/* =================================
   MOVE
================================= */

function moveDrag(e){

  if(!dragging)
    return;


  const boardRect =
    board.getBoundingClientRect();


  let x =
    e.clientX -
    boardRect.left -
    offsetX;


  let y =
    e.clientY -
    boardRect.top -
    offsetY;


  /*
    Piece stays inside box.
  */

  x =
    Math.max(
      0,
      Math.min(
        BW - PW,
        x
      )
    );


  y =
    Math.max(
      0,
      Math.min(
        BH - PH,
        y
      )
    );


  dragging.el.style.left =
    x + "px";

  dragging.el.style.top =
    y + "px";

}


/* =================================
   DROP
================================= */

function endDrag(){

  if(!dragging)
    return;


  const p =
    dragging;


  p.el.classList.remove(
    "dragging"
  );


  const x =
    parseFloat(
      p.el.style.left
    );


  const y =
    parseFloat(
      p.el.style.top
    );


  const distance =
    Math.hypot(
      x - p.correctX,
      y - p.correctY
    );


  /*
    Correct position
  */

  if(
    distance <
    Math.min(PW,PH) * .30
  ){

    p.el.style.left =
      p.correctX + "px";

    p.el.style.top =
      p.correctY + "px";


    p.locked = true;


    /*
      🔽 Placed piece goes BELOW
      all movable pieces.
    */

    p.el.style.zIndex =
      "1";


    p.el.classList.add(
      "locked"
    );


    solved++;


    bar.style.width =
      (solved / TOTAL * 100) +
      "%";


    statusText.textContent =
      solved +
      " / " +
      TOTAL +
      " pieces completed ❤️";


    if(solved === TOTAL){

      statusText.textContent =
        "✨ MEMORY UNLOCKED ✨";


      setTimeout(
        showFinal,
        750
      );

    }

  }else{

    /*
      Wrong place:
      piece remains movable.
    */

    p.el.style.zIndex =
      "10";

  }


  dragging = null;

}


/* =================================
   FINAL SCREEN
================================= */

function showFinal(){

  document.getElementById(
    "page"
  ).style.display =
    "none";


  document.getElementById(
    "final"
  ).style.display =
    "flex";


  startConfetti();

}


/* =================================
   CONFETTI
================================= */

function startConfetti(){

  for(
    let i=0;
    i<130;
    i++
  ){

    setTimeout(function(){

      const c =
        document.createElement(
          "div"
        );


      c.className =
        "confetti";


      c.style.left =
        Math.random() * 100 +
        "vw";


      const colors = [

        "#f6dc91",
        "#ffffff",
        "#d9a6ff",
        "#ff9eb7"

      ];


      c.style.background =
        colors[
          Math.floor(
            Math.random() *
            colors.length
          )
        ];


      c.style.animationDuration =
        (
          2 +
          Math.random() * 3
        ) +
        "s";


      document.body.appendChild(c);


      setTimeout(
        function(){
          c.remove();
        },
        5500
      );

    },
    Math.random() * 1700);

  }

}


/* =================================
   IMAGE LOAD
================================= */

const photo =
  new Image();


photo.onload =
  function(){

    buildPuzzle();

  };


photo.onerror =
  function(){

    statusText.innerHTML =
      "⚠️ Put <b>photo01.jpg</b> beside index.html";

  };


photo.src =
  IMAGE;


/* =================================
   RESIZE
================================= */

window.addEventListener(
  "resize",
  function(){

    if(!dragging){

      buildPuzzle();

    }

  }
);

</script>

</body>
  </html>
