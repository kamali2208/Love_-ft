<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Advance Happy Birthday Partner ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 30%,#281435,#08050c 55%,#020204);
  color:white;
  font-family:Georgia,serif;
}

#page{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

#game{
  width:min(94vw,480px);
  text-align:center;
}

.heading{
  color:#f5d98d;
  font-size:clamp(22px,6vw,32px);
  letter-spacing:2px;
  margin-bottom:7px;
}

.info{
  color:#bdb3c5;
  font-size:12px;
  letter-spacing:1px;
  margin-bottom:18px;
}

/* =========================
   PUZZLE BOX
========================= */

#board{
  position:relative;

  width:min(92vw,420px);
  aspect-ratio:1/1;

  margin:auto;

  background:#09080b;

  border:2px solid #c59b4c;
  border-radius:10px;

  box-shadow:
    0 0 0 1px rgba(255,240,180,.15),
    0 18px 70px rgba(0,0,0,.85),
    0 0 35px rgba(220,175,80,.20);

  overflow:hidden;

  touch-action:none;
}

/*
  Every piece has a 1/3 size.
  The whole 3x3 puzzle therefore
  covers the complete box.
*/

.piece{
  position:absolute;

  width:33.333333%;
  height:33.333333%;

  touch-action:none;
  user-select:none;

  cursor:grab;

  transition:
    left .22s cubic-bezier(.2,.8,.2,1),
    top .22s cubic-bezier(.2,.8,.2,1),
    transform .15s ease;

  z-index:5;
}

.piece.dragging{
  cursor:grabbing;
  transform:scale(1.035);
  z-index:100;
}

.piece.locked{
  cursor:default;
  z-index:3;
}

.piece svg{
  width:100%;
  height:100%;
  display:block;

  overflow:visible;

  filter:
    drop-shadow(0 4px 4px rgba(0,0,0,.75));
}

/* Puzzle outline */

.outline{
  fill:none;
  stroke:rgba(255,255,255,.55);
  stroke-width:1.1;
}

/* =========================
   PROGRESS
========================= */

.progress{
  width:80%;
  height:5px;
  margin:16px auto 0;

  background:#28212c;
  border-radius:10px;
  overflow:hidden;
}

#bar{
  width:0%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      #b98732,
      #ffe7a0,
      #b98732
    );

  box-shadow:0 0 12px #e5c76c;

  transition:width .3s ease;
}

#status{
  margin-top:9px;
  min-height:18px;

  color:#d0c4d5;
  font-size:12px;
}

/* =========================
   FINAL
========================= */

#final{
  position:fixed;
  inset:0;

  display:none;

  justify-content:center;
  align-items:center;

  text-align:center;

  padding:20px;

  z-index:500;

  background:
    radial-gradient(
      circle at center,
      #421b55,
      #09050e 65%
    );
}

.finalBox{
  width:min(92vw,500px);

  animation:
    finalIn 1.3s
    cubic-bezier(.2,.9,.2,1);
}

@keyframes finalIn{
  from{
    opacity:0;
    transform:scale(.65) translateY(30px);
  }

  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

.finalPhoto{
  width:min(65vw,270px);
  height:min(65vw,270px);

  object-fit:cover;

  border-radius:50%;

  padding:5px;

  background:
    linear-gradient(
      135deg,
      #fff1a8,
      #9b6826,
      #fff1a8
    );

  box-shadow:
    0 0 30px rgba(255,215,120,.6),
    0 0 90px rgba(255,175,60,.25);
}

.small{
  margin-top:20px;

  color:#cfc0d4;

  font-size:10px;

  letter-spacing:4px;
}

.wish{
  margin-top:12px;

  color:#ffe5a1;

  font-size:
    clamp(30px,8vw,55px);

  line-height:1.05;

  text-shadow:
    0 0 15px rgba(255,220,130,.7),
    0 0 55px rgba(255,180,60,.3);
}

.partner{
  margin-top:12px;

  color:white;

  font-size:22px;

  letter-spacing:5px;
}

.message{
  margin:18px auto 0;

  max-width:400px;

  color:#d7cedc;

  font-size:14px;

  line-height:1.8;
}

/* =========================
   CONFETTI
========================= */

.confetti{
  position:fixed;

  top:-20px;

  width:7px;
  height:12px;

  z-index:1000;

  animation:
    fall linear forwards;
}

@keyframes fall{
  to{
    transform:
      translateY(110vh)
      rotate(720deg);

    opacity:0;
  }
}
</style>
</head>

<body>

<div id="page">

  <div id="game">

    <div class="heading">
      🧩 Complete The Memory
    </div>

    <div class="info">
      PUT EVERY PIECE IN ITS PLACE ❤️
    </div>

    <div id="board"></div>

    <div class="progress">
      <div id="bar"></div>
    </div>

    <div id="status">
      Drag the pieces into the correct places...
    </div>

  </div>

</div>


<!-- FINAL -->

<div id="final">

  <div class="finalBox">

    <img
      src="photo01.jpg"
      class="finalPhoto"
      alt="Birthday Photo"
    >

    <div class="small">
      MEMORY COMPLETE ✨
    </div>

    <div class="wish">
      ADVANCE HAPPY<br>
      BIRTHDAY
    </div>

    <div class="partner">
      PARTNER ❤️
    </div>

    <div class="message">
      Every little piece found its place...
      <br>
      just like every beautiful memory
      finds its place in the heart. ❤️
    </div>

  </div>

</div>


<script>

const IMAGE="photo01.jpg";

const ROWS=3;
const COLS=3;
const TOTAL=9;

const board=
  document.getElementById("board");

const bar=
  document.getElementById("bar");

const statusText=
  document.getElementById("status");

let BW=0;
let BH=0;

let PW=0;
let PH=0;

let pieces=[];

let solved=0;

let dragging=null;

let offsetX=0;
let offsetY=0;


/* =====================================
   INTERNAL EDGE DATA
===================================== */

/*
  rightEdges[r][c]

  Controls the edge between:
  [r,c] and [r,c+1]
*/

const rightEdges=[];


/*
  bottomEdges[r][c]

  Controls the edge between:
  [r,c] and [r+1,c]
*/

const bottomEdges=[];


function randomEdge(){

  return Math.random()<.5
    ? 1
    : -1;

}


function createEdgeData(){

  for(
    let r=0;
    r<ROWS;
    r++
  ){

    rightEdges[r]=[];

    for(
      let c=0;
      c<COLS-1;
      c++
    ){

      rightEdges[r][c]=
        randomEdge();

    }

  }


  for(
    let r=0;
    r<ROWS-1;
    r++
  ){

    bottomEdges[r]=[];

    for(
      let c=0;
      c<COLS;
      c++
    ){

      bottomEdges[r][c]=
        randomEdge();

    }

  }

}


/* =====================================
   REAL JIGSAW EDGE
===================================== */

/*
  Internal horizontal edge.

  +1 = tab
  -1 = slot
*/

function horizontalEdge(shape){

  const bulge =
    shape===1
    ? -21
    : 21;

  return `
    L 33 0

    C 33 ${bulge},
      67 ${bulge},
      67 0

    L 100 0
  `;
}


/*
  Bottom is the exact opposite
  of the neighbour's top.
*/

function horizontalBottom(shape){

  const bulge =
    shape===1
    ? 21
    : -21;

  return `
    L 67 100

    C 67 ${100+bulge},
      33 ${100+bulge},
      33 100

    L 0 100
  `;
}


/*
  Right side.
*/

function verticalRight(shape){

  const bulge =
    shape===1
    ? -21
    : 21;

  return `
    L 100 33

    C ${100+bulge} 33,
      ${100+bulge} 67,
      100 67

    L 100 100
  `;
}


/*
  Left side is opposite.
*/

function verticalLeft(shape){

  const bulge =
    shape===1
    ? 21
    : -21;

  return `
    L 0 67

    C ${bulge} 67,
      ${bulge} 33,
      0 33

    L 0 0
  `;
}


/* =====================================
   CREATE PATH
===================================== */

function makePath(r,c){

  let d="M 0 0";


  /* TOP */

  if(r===0){

    /*
      Outer border stays straight.
    */

    d+=" L 100 0";

  }else{

    /*
      Opposite of piece above.
    */

    d+=horizontalEdge(
      -bottomEdges[r-1][c]
    );

  }


  /* RIGHT */

  if(c===COLS-1){

    /*
      Outer border stays straight.
    */

    d+=" L 100 100";

  }else{

    d+=verticalRight(
      rightEdges[r][c]
    );

  }


  /* BOTTOM */

  if(r===ROWS-1){

    /*
      Outer border stays straight.
    */

    d+=" L 0 100";

  }else{

    d+=horizontalBottom(
      bottomEdges[r][c]
    );

  }


  /* LEFT */

  if(c===0){

    /*
      Outer border stays straight.
    */

    d+=" L 0 0";

  }else{

    d+=verticalLeft(
      -rightEdges[r][c-1]
    );

  }


  d+=" Z";

  return d;
}


/* =====================================
   CREATE ONE PIECE
===================================== */

function createPiece(r,c){

  const piece=
    document.createElement("div");

  piece.className="piece";

  piece.style.width=
    PW+"px";

  piece.style.height=
    PH+"px";


  const svgNS=
    "http://www.w3.org/2000/svg";


  const svg=
    document.createElementNS(
      svgNS,
      "svg"
    );


  /*
    Extra viewBox space allows tabs
    without cutting them.
  */

  svg.setAttribute(
    "viewBox",
    "-22 -22 144 144"
  );


  svg.setAttribute(
    "preserveAspectRatio",
    "none"
  );


  const defs=
    document.createElementNS(
      svgNS,
      "defs"
    );


  const clip=
    document.createElementNS(
      svgNS,
      "clipPath"
    );


  const clipID=
    "clip_"+r+"_"+c;


  clip.setAttribute(
    "id",
    clipID
  );


  const shape=
    document.createElementNS(
      svgNS,
      "path"
    );


  const path=
    makePath(r,c);


  shape.setAttribute(
    "d",
    path
  );


  clip.appendChild(shape);

  defs.appendChild(clip);

  svg.appendChild(defs);


  /* =================================
     PHOTO
  ================================= */

  const image=
    document.createElementNS(
      svgNS,
      "image"
    );


  image.setAttribute(
    "href",
    IMAGE
  );


  /*
    Every piece uses the SAME complete image.

    Only its jigsaw clip is visible.
  */

  image.setAttribute(
    "x",
    -(c*100)
  );

  image.setAttribute(
    "y",
    -(r*100)
  );

  image.setAttribute(
    "width",
    COLS*100
  );

  image.setAttribute(
    "height",
    ROWS*100
  );

  image.setAttribute(
    "preserveAspectRatio",
    "none"
  );

  image.setAttribute(
    "clip-path",
    `url(#${clipID})`
  );


  svg.appendChild(image);


  /* OUTLINE */

  const outline=
    document.createElementNS(
      svgNS,
      "path"
    );


  outline.setAttribute(
    "d",
    path
  );

  outline.setAttribute(
    "class",
    "outline"
  );


  svg.appendChild(outline);


  piece.appendChild(svg);

  board.appendChild(piece);


  const data={

    el:piece,

    row:r,
    col:c,

    correctX:
      c*PW,

    correctY:
      r*PH,

    locked:false

  };


  pieces.push(data);


  piece.addEventListener(
    "pointerdown",
    e=>startDrag(e,data)
  );

}


/* =====================================
   BUILD PUZZLE
===================================== */

function buildPuzzle(){

  board.innerHTML="";

  pieces=[];

  solved=0;

  BW=
    board.clientWidth;

  BH=
    board.clientHeight;

  PW=
    BW/COLS;

  PH=
    BH/ROWS;


  createEdgeData();


  for(
    let r=0;
    r<ROWS;
    r++
  ){

    for(
      let c=0;
      c<COLS;
      c++
    ){

      createPiece(r,c);

    }

  }


  shuffle();

}


/* =====================================
   SHUFFLE
===================================== */

function shuffle(){

  /*
    IMPORTANT:
    The pieces remain inside
    the same 3×3 puzzle box.
  */

  pieces.forEach(p=>{

    let x;
    let y;

    do{

      x=
        Math.random()*
        (BW-PW);

      y=
        Math.random()*
        (BH-PH);

    }while(

      Math.abs(
        x-p.correctX
      ) < PW*.35 &&

      Math.abs(
        y-p.correctY
      ) < PH*.35

    );


    p.el.style.left=
      x+"px";

    p.el.style.top=
      y+"px";

  });

}


/* =====================================
   TOUCH / DRAG
===================================== */

function startDrag(e,p){

  if(p.locked)
    return;

  dragging=p;

  const rect=
    p.el.getBoundingClientRect();


  offsetX=
    e.clientX-
    rect.left;

  offsetY=
    e.clientY-
    rect.top;


  p.el.classList.add(
    "dragging"
  );


  p.el.setPointerCapture(
    e.pointerId
  );


  p.el.onpointermove=
    moveDrag;

  p.el.onpointerup=
    endDrag;

}


/* =====================================
   MOVE
===================================== */

function moveDrag(e){

  if(!dragging)
    return;


  const rect=
    board.getBoundingClientRect();


  let x=
    e.clientX-
    rect.left-
    offsetX;


  let y=
    e.clientY-
    rect.top-
    offsetY;


  /*
    HARD LIMIT.

    Pieces NEVER leave the big box.
  */

  x=
    Math.max(
      0,
      Math.min(
        BW-PW,
        x
      )
    );


  y=
    Math.max(
      0,
      Math.min(
        BH-PH,
        y
      )
    );


  dragging.el.style.left=
    x+"px";

  dragging.el.style.top=
    y+"px";

}


/* =====================================
   DROP
===================================== */

function endDrag(){

  if(!dragging)
    return;


  const p=
    dragging;


  p.el.classList.remove(
    "dragging"
  );


  const x=
    parseFloat(
      p.el.style.left
    );


  const y=
    parseFloat(
      p.el.style.top
    );


  const distance=
    Math.hypot(
      x-p.correctX,
      y-p.correctY
    );


  /*
    Snap tolerance.
  */

  if(
    distance<
    Math.min(PW,PH)*.32
  ){

    p.el.style.left=
      p.correctX+"px";

    p.el.style.top=
      p.correctY+"px";


    p.locked=true;

    p.el.classList.add(
      "locked"
    );


    solved++;


    const percent=
      (solved/TOTAL)*100;


    bar.style.width=
      percent+"%";


    statusText.textContent=
      solved+
      " / "+
      TOTAL+
      " pieces completed ❤️";


    if(solved===TOTAL){

      statusText.textContent=
        "✨ MEMORY COMPLETE ✨";

      setTimeout(
        showFinal,
        700
      );

    }

  }


  dragging=null;

}


/* =====================================
   FINAL SCREEN
===================================== */

function showFinal(){

  document.getElementById(
    "page"
  ).style.display="none";


  document.getElementById(
    "final"
  ).style.display="flex";


  startConfetti();

}


/* =====================================
   CONFETTI
===================================== */

function startConfetti(){

  for(
    let i=0;
    i<120;
    i++
  ){

    setTimeout(()=>{

      const c=
        document.createElement(
          "div"
        );


      c.className=
        "confetti";


      c.style.left=
        Math.random()*100+
        "vw";


      const colors=[
        "#f5d98a",
        "#ffffff",
        "#d9a5ff",
        "#ff9eb7"
      ];


      c.style.background=
        colors[
          Math.floor(
            Math.random()*
            colors.length
          )
        ];


      c.style.animationDuration=
        (
          2+
          Math.random()*3
        )+"s";


      document.body.appendChild(c);


      setTimeout(
        ()=>c.remove(),
        5000
      );

    },
    Math.random()*1600);

  }

}


/* =====================================
   PHOTO LOAD
===================================== */

const photo=
  new Image();


photo.onload=
  buildPuzzle;


photo.onerror=
  ()=>{
    statusText.innerHTML=
      "⚠️ Keep <b>photo01.jpg</b> beside index.html";
  };


photo.src=
  IMAGE;


/* =====================================
   RESIZE
===================================== */

window.addEventListener(
  "resize",
  ()=>{
    if(!dragging){
      buildPuzzle();
    }
  }
);

</script>

</body>
  </html>
